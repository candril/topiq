<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="topiq">
  <rect width="256" height="256" rx="56" fill="#1a1b26"/>
  <!-- three partitions of a topic -->
  <g fill="#1f2335">
    <rect x="34" y="58" width="188" height="36" rx="10"/>
    <rect x="34" y="110" width="188" height="36" rx="10"/>
    <rect x="34" y="162" width="188" height="36" rx="10"/>
  </g>
  <!-- messages, oldest to the left; newest fade in -->
  <g fill="#7aa2f7">
    <rect x="44" y="66" width="20" height="20" rx="5" opacity=".35"/>
    <rect x="70" y="66" width="20" height="20" rx="5" opacity=".55"/>
    <rect x="96" y="66" width="20" height="20" rx="5" opacity=".8"/>
    <rect x="122" y="66" width="20" height="20" rx="5"/>
  </g>
  <g fill="#bb9af7">
    <rect x="44" y="118" width="20" height="20" rx="5" opacity=".35"/>
    <rect x="70" y="118" width="20" height="20" rx="5" opacity=".55"/>
    <rect x="96" y="118" width="20" height="20" rx="5" opacity=".8"/>
    <rect x="122" y="118" width="20" height="20" rx="5"/>
    <rect x="148" y="118" width="20" height="20" rx="5"/>
  </g>
  <g fill="#9ece6a">
    <rect x="44" y="170" width="20" height="20" rx="5" opacity=".35"/>
    <rect x="70" y="170" width="20" height="20" rx="5" opacity=".6"/>
    <rect x="96" y="170" width="20" height="20" rx="5"/>
  </g>
  <!-- the message under the cursor -->
  <rect x="92" y="114" width="28" height="28" rx="7" fill="none" stroke="#c0caf5" stroke-width="4"/>
  <!-- …replayed to the end of its partition -->
  <path d="M120 106 C 150 80, 190 84, 198 116" fill="none" stroke="#e0af68" stroke-width="6" stroke-linecap="round"/>
  <polygon points="186,110 204,124 208,104" fill="#e0af68"/>
  <rect x="188" y="118" width="20" height="20" rx="5" fill="#e0af68"/>
</svg>
